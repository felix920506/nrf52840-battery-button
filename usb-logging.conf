#
# Development overlay: log to the USB serial port and allow reflashing via a
# 1200 baud touch:
#   west build ... -- -DEXTRA_CONF_FILE=usb-logging.conf
# USB draws power; not for battery operation.
#
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_NCS_BOOT_BANNER=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_APP_USB_BOOTLOADER_RESET=y
