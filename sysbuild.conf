SB_CONFIG_MATTER=y
SB_CONFIG_PARTITION_MANAGER=n

# Barebones: no MCUboot and no Matter OTA. The board's Adafruit UF2 bootloader
# stays in place (see boards/xiao_ble.overlay and sysbuild.cmake).
SB_CONFIG_MATTER_OTA=n

# Don't generate factory data in the build: it would give every device the
# same, publicly known Matter test passcode (20202021). Each device gets its
# own credentials from tools/provision_device.py instead.
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n
