SB_CONFIG_MATTER=y
SB_CONFIG_PARTITION_MANAGER=n

# Barebones: no MCUboot and no Matter OTA. The board's Adafruit UF2 bootloader
# stays in place (see boards/xiao_ble.overlay and sysbuild.cmake).
SB_CONFIG_MATTER_OTA=n

# Generate the factory data partition (test DAC/PAI, discriminator, passcode)
# as a separate image. `west flash` programs the application and then the
# factory data; build/battery_switch.uf2 contains both.
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=y
