SB_CONFIG_MATTER=y
SB_CONFIG_PARTITION_MANAGER=n

# Barebones: no MCUboot and no Matter OTA. The whole internal flash is used by
# the application (see boards/xiao_ble.overlay).
SB_CONFIG_MATTER_OTA=n

# Generate the factory data partition (test DAC/PAI, discriminator, passcode)
# and merge it into merged.hex, which `west flash` programs.
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=y
