# West manifest for a workspace application.
#
#   west init -m https://github.com/<you>/nrf52840-battery-button --mr main battery-switch-ws
#   cd battery-switch-ws && west update
#
# This pulls nRF Connect SDK v3.4.1 (Zephyr, OpenThread, Matter) next to this repository.

manifest:
  version: "0.13"

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.4.1
      import: true

  self:
    path: nrf52840-battery-button
