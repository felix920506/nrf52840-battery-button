#
# Debug overlay: logs and printk over SEGGER RTT (needs the SWD probe).
#   west build -b xiao_ble/nrf52840 --sysbuild -- -DEXTRA_CONF_FILE=debug.conf
#
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_NCS_BOOT_BANNER=y
CONFIG_THREAD_NAME=y
CONFIG_RESET_ON_FATAL_ERROR=n
