#
# DEVELOPMENT ONLY. Build without the Matter factory data partition and use the
# test credentials built into the Matter SDK instead (discriminator 3840,
# passcode 20202021, example DAC). Keeps the image small enough for serial DFU.
# Also pass -DSB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n to west build.
#
CONFIG_CHIP_FACTORY_DATA_NONE=y
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
