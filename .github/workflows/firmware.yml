# Builds the ready-to-flash UF2 files, one per board. Every device creates
# its own pairing code on first boot, so the same file works for all devices
# of a board type.
#
# Pushing a tag publishes the files as a GitHub release named after the tag:
#   git tag v1.0.0 && git push origin v1.0.0
# Pushes to master and pull requests only build (files under the run's
# artifacts).

name: Firmware

on:
  push:
    branches: [master]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

env:
  NCS_VERSION: v3.4.1

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/nrf52840-battery-button
          # Full history with tags: the firmware version is the tag or the
          # short commit hash (see CMakeLists.txt).
          fetch-depth: 0

      - name: Install nrfutil and the nRF Connect SDK toolchain
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL -o ~/.local/bin/nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x ~/.local/bin/nrfutil
          echo ~/.local/bin >> "$GITHUB_PATH"
          ~/.local/bin/nrfutil install sdk-manager
          ~/.local/bin/nrfutil sdk-manager toolchain install --ncs-version "$NCS_VERSION"

      - name: Cache the SDK sources
        uses: actions/cache@v4
        with:
          path: |
            ws/.west
            ws/bootloader
            ws/modules
            ws/nrf
            ws/nrfxlib
            ws/test
            ws/tools
            ws/zephyr
          key: ncs-${{ env.NCS_VERSION }}-${{ hashFiles('ws/nrf52840-battery-button/west.yml') }}

      - name: Fetch the SDK
        working-directory: ws
        run: |
          [ -d .west ] || nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            west init -l nrf52840-battery-button
          nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            west update --narrow -o=--depth=1

      # One file per board family: the XIAO file also runs on the XIAO Sense
      # and Plus, the Feather file on the Feather Sense, the Pro Micro file on
      # nice!nano and SuperMini boards.
      - name: Build
        working-directory: ws/nrf52840-battery-button
        run: |
          mkdir -p out
          build() {
            nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
              west build -b "$2" --sysbuild -d "build-$1"
            cp "build-$1/battery_switch_app.uf2" "out/battery-switch-$1.uf2"
          }
          build xiao-nrf52840     xiao_ble/nrf52840
          build feather-nrf52840  adafruit_feather_nrf52840/nrf52840/uf2
          build promicro-nrf52840 promicro_nrf52840/nrf52840/uf2

          # Erases the factory data page (same address on every board), so a
          # device creates a new pairing code.
          nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            python3 tools/provision_device.py --build-dir build-xiao-nrf52840 \
              --blank out/new-pairing-code.uf2
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ws/nrf52840-battery-button/out/*.uf2

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ws/nrf52840-battery-button
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.uf2 --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
