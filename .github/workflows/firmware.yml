# Builds the ready-to-flash UF2 files, one per board. Every device creates
# its own pairing code on first boot, so the same file works for all devices
# of a board type.
#
# Pushing a tag publishes the files as a GitHub release named after the tag:
#   git tag v1.0.0 && git push origin v1.0.0
# Pushes to master and pull requests only build (files under the run's
# artifacts).
#
# Each board builds on its own runner, in parallel: on GitHub's runners the
# downloads are quick and the compile is what takes time.
#
# Pushes and pull requests that only touch documentation don't build. Tag
# pushes always build: GitHub ignores path filters for tags.

name: Firmware

on:
  push:
    branches: [master]
    tags: ["**"]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # Not pull_request_target: that would run the base branch's workflow, but
  # with write access, secrets and the base branch's cache, while the build
  # still runs the PR's own code (CMake, west.yml, tools/). A pull_request run
  # from a fork gets a read-only token, no secrets and a cache scoped to the
  # PR, whatever workflow file the PR carries.
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

# Jobs get a read-only token unless they ask for more (only release does).
permissions:
  contents: read

env:
  NCS_VERSION: v3.4.1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One file per board family: the XIAO file also runs on the XIAO
        # Sense and Plus, the Feather file on the Feather Sense, the Pro Micro
        # file on nice!nano and SuperMini boards.
        include:
          - name: xiao-nrf52840
            board: xiao_ble/nrf52840
          - name: feather-nrf52840
            board: adafruit_feather_nrf52840/nrf52840/uf2
          - name: promicro-nrf52840
            board: promicro_nrf52840/nrf52840/uf2
          # The nRF52840 Dongle (boards/nrf52840dongle.overlay) isn't built
          # here: it needs Nordic's tools to flash, so it is left to advanced
          # users who build it themselves.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ws/nrf52840-battery-button
          # Nothing pushes back, so don't leave the token in .git/config for
          # the build to read.
          persist-credentials: false
          # Full history with tags: the firmware version is the tag or the
          # short commit hash (see sysbuild.cmake).
          fetch-depth: 0

      - name: Install nrfutil and the nRF Connect SDK toolchain
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL -o ~/.local/bin/nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x ~/.local/bin/nrfutil
          echo ~/.local/bin >> "$GITHUB_PATH"
          ~/.local/bin/nrfutil install sdk-manager
          ~/.local/bin/nrfutil sdk-manager toolchain install --ncs-version "$NCS_VERSION"

      - name: Cache the SDK sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ws/.west
            ws/bootloader
            ws/modules
            ws/nrf
            ws/nrfxlib
            ws/test
            ws/tools
            ws/zephyr
          key: ncs-${{ env.NCS_VERSION }}-${{ hashFiles('ws/nrf52840-battery-button/west.yml') }}

      - name: Fetch the SDK
        working-directory: ws
        run: |
          [ -d .west ] || nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            west init -l nrf52840-battery-button
          nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            west update --narrow -o=--depth=1

      - name: Build
        working-directory: ws/nrf52840-battery-button
        run: |
          nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            west build -b "${{ matrix.board }}" --sysbuild -d build
          mkdir -p out
          cp build/battery_switch_app.uf2 "out/battery-switch-${{ matrix.name }}.uf2"

      # Erases the factory data page, so a device creates a new pairing code.
      # Same address on every UF2 board, so one file serves all of them.
      - name: New pairing code UF2
        if: matrix.name == 'xiao-nrf52840'
        working-directory: ws/nrf52840-battery-button
        run: |
          nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
            python3 tools/provision_device.py --build-dir build --blank out/new-pairing-code.uf2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: battery-switch-${{ matrix.name }}
          path: ws/nrf52840-battery-button/out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
