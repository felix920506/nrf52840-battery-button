name: Triage report
description: Filed with tools/triage.py, where a coding agent helped investigate the problem.
body:
  - type: markdown
    attributes:
      value: |
        This is the structure `tools/triage.py` agents follow. Keep one problem per
        issue. Never paste the device serial number, Thread network keys or home
        directory paths.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in observations, logs and source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps if they were found.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Firmware version
      description: The release tag or commit hash (Home Assistant shows it as Firmware), or unknown.
      placeholder: v1.2.0
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board and image
      description: The board, and the release file or the build configuration.
      placeholder: XIAO nRF52840 Sense, battery-switch-xiao-nrf52840.uf2
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: Controller and network
      description: Matter controller and version, Thread border router.
      placeholder: Home Assistant 2026.11, Matter server 8.1, SkyConnect OTBR

  - type: input
    id: power
    attributes:
      label: Power and wiring
      description: Battery type and capacitor, switches and their types, cable lengths if relevant.
      placeholder: 2x AAA NiMH on 3V3, two momentary buttons on D0 and D1

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The most relevant log lines, serial output or controller errors only. Redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was done to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model produced this report.
      placeholder: Claude Code (claude-opus-5-5) via tools/triage.py
