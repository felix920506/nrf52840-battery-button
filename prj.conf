#
# Low-power configuration (default). For logs over SEGGER RTT build with
#   west build ... -- -DEXTRA_CONF_FILE=debug.conf
#

# ---------------------------------------------------------------------------
# Matter
# ---------------------------------------------------------------------------
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Battery Switch"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/battery_switch.zap"

# Test Vendor ID / Product ID (0xFFF1 / 0x8000). Replace for a real product.
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

# Start BLE commissioning advertising on boot while not commissioned.
# Afterwards, pressing any switch restarts it.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15

CONFIG_BT_DEVICE_NAME="MatterSwitch"
CONFIG_BT_DEVICE_NAME_MAX=18

CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Parts of the nRF Matter sample commons that are not used.
CONFIG_NCS_SAMPLE_MATTER_TEST_EVENT_TRIGGERS=n
CONFIG_CHIP_LIB_SHELL=n

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_FLASH=y

# Flash with an SWD probe, no UF2 bootloader (see README).
CONFIG_BUILD_OUTPUT_UF2=n

# ---------------------------------------------------------------------------
# Power
# ---------------------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# No USB: the board would otherwise bring up USB CDC ACM as console.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_BOOT_BANNER=n
CONFIG_THREAD_NAME=n

CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Reduce flash usage.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
