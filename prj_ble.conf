#
# Bluetooth LE transport (for testing without a Thread network):
#   west build -b xiao_ble/nrf52840 --sysbuild -- -DFILE_SUFFIX=ble
# This file replaces prj.conf and sysbuild_ble.conf replaces sysbuild.conf.
#

CONFIG_APP_TRANSPORT_BLE=y

CONFIG_BT_DEVICE_NAME="BatterySwitch"
# Appearance: Generic Remote Control.
CONFIG_BT_DEVICE_APPEARANCE=384
CONFIG_BT_MAX_CONN=1

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_FLASH=y

# Switch types changed over BLE are stored in the settings partition.
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# sysbuild.cmake builds build/battery_switch.uf2.
CONFIG_BUILD_OUTPUT_UF2=n

# Link at the application partition from devicetree (0x26000/0x27000 on UF2
# bootloader boards). Not every board's UF2 target sets this.
CONFIG_USE_DT_CODE_PARTITION=y

# ---------------------------------------------------------------------------
# Power
# ---------------------------------------------------------------------------
CONFIG_PM_DEVICE=y

# No USB console by default. Add usb-logging.conf/.overlay for development.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_RESET_ON_FATAL_ERROR=y
