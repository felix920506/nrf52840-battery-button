description: |
  External switches connected to GPIO inputs.

  Each child node is one switch. The first child is switch 1 (Matter
  endpoint 1), the second child is switch 2 and so on; up to 6 switches are
  supported. Wire each switch between the GPIO pin and GND and use
  (GPIO_PULL_UP | GPIO_ACTIVE_LOW) as flags.

compatible: "battery-switch,inputs"

child-binding:
  description: A single external switch.
  properties:
    gpios:
      type: phandle-array
      required: true
    label:
      type: string
      description: Human readable name, only used for logging.
    switch-type:
      type: string
      default: "momentary"
      enum:
        - "momentary"
        - "latching"
        - "latching-as-press"
      description: |
        momentary:
          Push button, closed only while held. Reports press, release,
          long press and multi press.

        latching:
          Rocker/toggle switch whose position can be seen on the switch and
          means something (e.g. up = on). Reports the switch position.

        latching-as-press:
          Electrically latching, but the position carries no meaning, e.g.
          plain-faced rockers (Panasonic Deco Lite, older Panasonic/National/
          Jimbo module switches) or switches that look like push buttons but
          latch (Schneider ZenCelo, Panasonic Cosmo Art, Rinsa, Glatima).
          Every change of state is reported as a short press, so controllers
          can use it like a push button. Changing it several times quickly
          counts as a multi press. Long press is not possible.
